<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sentinel — military, government &amp; LADD flights</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <aside id="panel">
      <header class="brand">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 6v6c0 5 3.8 9.3 9 10 5.2-.7 9-5 9-10V6z" /><path d="M12 7.5l.9 4 4.1 2.2v.9l-4.1-1.1-.3 3 1.4 1v.7L12 17.6l-2 .6v-.7l1.4-1-.3-3-4.1 1.1v-.9l4.1-2.2z" /></svg>
        <div>
          <h1>Sentinel</h1>
          <p class="tagline">Military, government &amp; LADD air traffic</p>
        </div>
      </header>

      <nav class="modes" role="tablist">
        <button role="tab" data-mode="live" aria-selected="true">Live</button>
        <button role="tab" data-mode="history" aria-selected="false">History</button>
      </nav>

      <fieldset class="cats">
        <legend>Categories</legend>
        <label class="cat mil"><input type="checkbox" value="mil" checked /><span class="check"></span>Military<b data-count="mil">–</b></label>
        <label class="cat gov"><input type="checkbox" value="gov" checked /><span class="check"></span>Government<b data-count="gov">–</b></label>
        <label class="cat ladd"><input type="checkbox" value="ladd" checked /><span class="check"></span>LADD<b data-count="ladd">–</b></label>
      </fieldset>

      <form id="history-form" class="history-form" hidden>
        <label>From <input type="datetime-local" name="from" required /></label>
        <label>To <input type="datetime-local" name="to" required /></label>
        <button type="submit">Load window</button>
      </form>

      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="m16 16 4.5 4.5" /></svg>
        <input id="search" type="search" placeholder="Search callsign, registration, hex" autocomplete="off" aria-label="Search aircraft" />
      </div>

      <div class="list-head" aria-hidden="true"><span>Aircraft</span><span>Altitude</span></div>
      <ul id="list" role="listbox" aria-label="Aircraft"></ul>

      <footer id="status" aria-live="polite">Waiting for first update…</footer>
    </aside>

    <main id="map" aria-label="Aircraft map"></main>

    <section id="detail" hidden aria-live="polite"></section>

    <section id="replay" hidden>
      <button id="play" type="button" aria-label="Play track">▶</button>
      <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Track time" />
      <time id="scrub-time"></time>
    </section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
